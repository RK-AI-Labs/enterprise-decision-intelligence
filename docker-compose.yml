services:
  app:
    build: .
    container_name: ai-template-python
    volumes:
      - .:/app
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enterprise_decision_intelligence
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: enterprise_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise -d enterprise_decision_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
